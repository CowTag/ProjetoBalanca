services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cowtag
      POSTGRES_PASSWORD: cowtag
      POSTGRES_DB: cowtag
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cowtag"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
